services:
  postgres:
    image: postgres:16
    container_name: inventory-postgres
    restart: always

    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: inventory-api
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=inventorydb;Username=postgres;Password=yourpassword"

    ports:
      - "5001:8080"

  frontend:
    build: ./frontend
    container_name: inventory-frontend
    restart: always

    depends_on:
      - api

    ports:
      - "5173:80"

volumes:
  pgdata:
